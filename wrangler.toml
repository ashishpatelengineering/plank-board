name = "plank-board"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
# keep_vars makes sure a deploy from GitHub never wipes anything you set in the dashboard.
keep_vars = true
preview_urls = false   # preview links are separate addresses; keep them off

# The page itself is served by the same Worker, so there is one thing to deploy.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Board"]

[[d1_databases]]
binding = "DB"
database_name = "plank-board"
database_id = "b57161aa-1b0b-459f-89cd-c31a3f8f3ff5"
# No database_id on purpose: Cloudflare creates the database on the first deploy.
# If that ever fails, create one (npx wrangler d1 create plank-board, or in the dashboard)
# and add its id here:  database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# The team password is NOT written here. Add it in the Cloudflare dashboard as a secret named TEAM_PASSWORD
# (Workers and Pages > plank-board > Settings > Variables and Secrets). See GITHUB-SETUP.txt.
