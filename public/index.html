<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16263f">
<script>try{var t=localStorage.getItem('plank.theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<title>Plank Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: flat, quiet surfaces. A deep navy bar, pale cool-grey trays, white cards, one restrained steel-blue accent. No gradients or glow. */
:root {
  --bg: #eef1f5;
  --panel: #e4e9f0;
  --panel-grad: #e4e9f0;
  --surface: #ffffff;
  --line: #d5dce6;
  --line-strong: #b6c1d0;
  --ink: #14213d;
  --muted: #586579;
  --accent: #2a64a8;
  --accent-ink: #ffffff;
  --btn-bg: #2a64a8;
  --btn-line: #235590;
  --btn-ink: #ffffff;
  --btn-sh: none;
  --bar-bg: #16263f;
  --bar-sh: none; --bar-ink: #f3f6fb;
  --card-bg: #ffffff;
  --hi: transparent;
  --danger: #b42318;
  --ok: #17703f;
  --warn: #8a4b00;
  --shadow: 0 1px 2px rgba(20,33,61,.08), 0 12px 28px rgba(20,33,61,.16);
  --card-shadow: 0 1px 2px rgba(20,33,61,.06);
  --l-red: #ef6a62; --l-amber: #f4a62a; --l-green: #2fb57f;
  --l-teal: #14b2c2; --l-blue: #3b82f6; --l-violet: #8b6cf0;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Inter", ui-sans-serif, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b111b; --panel: #121b29; --panel-grad: #121b29; --surface: #1a2535; --line: #263348; --line-strong: #3a4a63;
    --ink: #e8edf5; --muted: #9aa8bd; --accent: #6ea8f0; --accent-ink: #071a33;
    --btn-bg: #2f6fba; --btn-line: #3a7bc8; --btn-ink: #ffffff; --btn-sh: none;
    --bar-bg: #101a2c; --bar-sh: none; --bar-ink: #f3f6fb;
    --card-bg: #1a2535; --hi: transparent;
    --danger: #ff9d92; --warn: #f2c46d; --ok: #6fd6a0;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.5);
    --card-shadow: 0 1px 2px rgba(0,0,0,.3);
    --l-red: #f27d74; --l-amber: #f5b34a; --l-green: #4cc995;
    --l-teal: #3cc6d4; --l-blue: #7a8cff; --l-violet: #a68cf5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b111b; --panel: #121b29; --panel-grad: #121b29; --surface: #1a2535; --line: #263348; --line-strong: #3a4a63;
  --ink: #e8edf5; --muted: #9aa8bd; --accent: #6ea8f0; --accent-ink: #071a33;
  --btn-bg: #2f6fba; --btn-line: #3a7bc8; --btn-ink: #ffffff; --btn-sh: none;
  --bar-bg: #101a2c; --bar-sh: none; --bar-ink: #f3f6fb;
  --card-bg: #1a2535; --hi: transparent;
  --danger: #ff9d92; --warn: #f2c46d; --ok: #6fd6a0;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.5);
  --card-shadow: 0 1px 2px rgba(0,0,0,.3);
  --l-red: #f27d74; --l-amber: #f5b34a; --l-green: #4cc995;
  --l-teal: #3cc6d4; --l-blue: #7a8cff; --l-violet: #a68cf5;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column;
  background: var(--bg); color: var(--ink);
  font: 400 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow: hidden;
}
body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
body.is-dragging #board { scroll-snap-type: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
::placeholder { color: var(--muted); opacity: .8; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ico circle.f { fill: currentColor; stroke: none; }

/* Top bar */
.bar { flex: none; height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 18px; background: var(--bar-bg); border-bottom: 1px solid rgba(255,255,255,.08); box-shadow: none; position: relative; z-index: 5; }
.brand { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 7px; background: var(--btn-bg); color: var(--btn-ink); border: 1px solid var(--btn-line); flex: none; box-shadow: none; }
.brand svg { width: 16px; height: 16px; fill: currentColor; }
.board-btn { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 56vw; height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; font-weight: 600; font-size: 15.5px; letter-spacing: -.02em; }
.board-btn:hover, .board-btn[aria-expanded="true"] { background: var(--panel); }
.board-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow { flex: 1; }
.warn { display: none; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--danger); background: color-mix(in srgb, var(--danger) 9%, var(--surface)); white-space: nowrap; }
.warn.show { display: inline-flex; }
.presence { display: none; align-items: center; margin-right: 6px; }
.presence.show { display: inline-flex; }
.presence .pp { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; border: 2px solid rgba(255,255,255,.85); margin-left: -7px; cursor: default; }
.presence .pp:first-child { margin-left: 0; }
.presence .pp.more { background: rgba(255,255,255,.22); }
.tm-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.tm-row:last-of-type { border-bottom: 0; }
.tm-who { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.tm-who small { display: block; color: var(--muted); font-size: 12px; }
.tm-add { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.tm-add .field { flex: 1 1 180px; min-width: 0; }
.act-row { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; overflow-wrap: anywhere; }
.act-row small { display: block; color: var(--muted); font-size: 12px; }
.search { position: relative; display: flex; align-items: center; }
.search .ico { position: absolute; left: 10px; color: var(--muted); pointer-events: none; }
.search input { width: 168px; height: 34px; padding: 0 10px 0 32px; border: 1px solid var(--line); border-radius: 6px; background: color-mix(in srgb, var(--panel) 55%, var(--surface)); transition: width .15s ease, border-color .15s; }
.search input:focus { width: 232px; background: var(--surface); border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.search input::-webkit-search-cancel-button { display: none; }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--muted); flex: none; }
.icon-btn:hover, .icon-btn[aria-expanded="true"] { background: var(--panel); color: var(--ink); }
/* the top bar carries the brand colour, so its controls are light on dark */
.bar { color: var(--bar-ink); }
.bar .brand { background: #ffffff; color: #16263f; border-color: transparent; box-shadow: none; }
.bar .board-btn { color: var(--bar-ink); }
.bar .board-btn:hover, .bar .board-btn[aria-expanded="true"], .bar .board-btn.on { background: rgba(255,255,255,.16); }
.bar .icon-btn { color: color-mix(in srgb, var(--bar-ink) 88%, transparent); }
.bar .icon-btn:hover, .bar .icon-btn[aria-expanded="true"], .bar .icon-btn.on { background: rgba(255,255,255,.16); color: var(--bar-ink); }
.bar .search .ico { color: color-mix(in srgb, var(--bar-ink) 85%, transparent); }
.bar .search input { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.3); color: var(--bar-ink); }
.bar .search input::placeholder { color: color-mix(in srgb, var(--bar-ink) 85%, transparent); opacity: 1; }
.bar .search input:focus { background: var(--surface); border-color: var(--surface); color: var(--ink); box-shadow: 0 0 0 3px rgba(255,255,255,.28); }
.bar .search input:focus::placeholder { color: var(--muted); opacity: .8; }
.bar .search:focus-within .ico { color: var(--muted); }
.bar .warn { background: #fff; color: var(--danger); }

/* Board */
#board { flex: 1; min-height: 0; display: flex; align-items: flex-start; gap: 12px; padding: 16px; overflow-x: auto; overflow-y: hidden; outline: none; }
.list { flex: 0 0 288px; width: 288px; max-height: 100%; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: none; }
.list-head { display: flex; align-items: center; gap: 4px; padding: 8px 6px 4px 8px; }
.list-title { flex: 1; min-width: 0; height: 30px; padding: 0 8px; border: 1px solid transparent; border-radius: 7px; background: transparent; font-weight: 600; font-size: 13.5px; letter-spacing: -.01em; text-overflow: ellipsis; }
.list-title:hover { background: color-mix(in srgb, var(--surface) 55%, transparent); }
.list-title:focus { background: var(--surface); border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.count { font: 500 12px var(--mono); color: var(--muted); padding: 0 4px; min-width: 18px; text-align: center; }
.cards { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 6px 8px 8px; overflow-y: auto; min-height: 12px; }
.card { background: var(--card-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--card-shadow); transition: border-color .12s, box-shadow .12s, transform .12s; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.card:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: 0 1px 3px rgba(20,33,61,.14); }
.card.dragging { opacity: .35; }
.card.ghost { position: fixed; left: 0; top: 0; z-index: 60; margin: 0; pointer-events: none; box-shadow: var(--shadow); opacity: .97; border-color: var(--accent); }
.card .title { overflow-wrap: anywhere; line-height: 1.4; font-weight: 500; }
.bars { display: flex; flex-wrap: wrap; gap: 4px; }
.bar-chip { width: 36px; height: 6px; border-radius: 3px; background: var(--c); }
.tag { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; height: 20px; padding: 0 8px 0 6px; border-radius: 6px; font-size: 11.5px; font-weight: 600; letter-spacing: -.005em; color: var(--ink); background: color-mix(in srgb, var(--c) 15%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 38%, var(--line)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.c-red { --c: var(--l-red); } .c-amber { --c: var(--l-amber); } .c-green { --c: var(--l-green); }
.c-teal { --c: var(--l-teal); } .c-blue { --c: var(--l-blue); } .c-violet { --c: var(--l-violet); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; color: var(--muted); font-size: 12px; }
.meta > span { display: inline-flex; align-items: center; gap: 4px; }
.meta .num { font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.due { padding: 1px 7px 1px 5px; border-radius: 6px; font-weight: 500; }
.due.soon { color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.due.overdue { color: var(--danger); background: color-mix(in srgb, var(--danger) 11%, transparent); }
.due.calm { color: var(--muted); background: transparent; }
.doneflag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px 1px 5px; border-radius: 6px; font-weight: 600; color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.card.is-done .title { color: var(--muted); }
.checks.complete { color: var(--accent); }
.drop-ind { position: absolute; left: 8px; right: 8px; height: 3px; border-radius: 2px; background: var(--accent); pointer-events: none; }
.list.drag-over { border-color: var(--accent); }
.list-foot { padding: 0 8px 8px; }
.add-btn { display: flex; align-items: center; gap: 6px; width: 100%; height: 32px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); text-align: left; }
.add-btn:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); color: var(--ink); }
.composer { display: flex; flex-direction: column; gap: 8px; }
.composer textarea, .field { width: 100%; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); resize: none; line-height: 1.4; }
.composer textarea:focus, .field:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.row { display: flex; align-items: center; gap: 8px; }
.btn { height: 32px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--btn-bg); border-color: var(--btn-line); color: var(--btn-ink); font-weight: 600; box-shadow: none; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--danger); }
.btn.danger-solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--panel); }
.add-list { flex: 0 0 288px; width: 288px; }
.add-list > .add-btn { height: 40px; padding: 0 12px; border: 1px dashed var(--line-strong); border-radius: 10px; }
.add-list > .add-btn:hover { background: var(--panel); border-style: solid; }
.add-list .composer { padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.empty-hint { padding: 8px 10px; color: var(--muted); font-size: 12.5px; text-align: center; }

/* Menu */
.menu { position: fixed; z-index: 40; min-width: 200px; max-width: min(320px, calc(100vw - 16px)); max-height: 60vh; overflow-y: auto; padding: 5px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
.menu-item { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 10px 0 6px; border: 0; border-radius: 7px; background: transparent; text-align: left; }
.menu-item:hover, .menu-item:focus-visible { background: var(--panel); outline: none; }
.menu-item.danger { color: var(--danger); }
.menu-item[disabled] { opacity: .45; cursor: default; }
.menu-item .ck { width: 14px; flex: none; display: grid; place-items: center; color: var(--accent); }
.menu-item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-item .n { font: 500 11.5px var(--mono); color: var(--muted); }
.menu .sep { height: 1px; margin: 5px 4px; background: var(--line); }

/* Dialogs and card sheet */
.overlay { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 16px; overflow-y: auto; background: rgba(10,18,32,.5); }
.modal { width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.modal.wide { max-width: 580px; max-height: calc(100vh - 6vh - 24px); overflow-y: auto; }
.dlg { display: flex; flex-direction: column; gap: 14px; padding: 20px; }
.dlg h2 { margin: 0; font-size: 16.5px; font-weight: 600; letter-spacing: -.01em; }
.dlg p { margin: 0; color: var(--muted); }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }
.cm { display: flex; flex-direction: column; gap: 18px; padding: 20px 22px 18px; }
.cm-head { display: flex; align-items: flex-start; gap: 8px; }
.cm-title { flex: 1; min-width: 0; padding: 4px 8px; margin: -4px -8px; border: 1px solid transparent; border-radius: 8px; background: transparent; font-size: 21px; font-weight: 600; letter-spacing: -.025em; line-height: 1.25; }
.cm-title:hover { background: var(--panel); }
.cm-title:focus { background: var(--surface); border-color: var(--accent); outline: none; }
.cm-sub { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--muted); font-size: 12.5px; }
.cm-sub select { height: 26px; padding: 0 22px 0 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); font-weight: 500; max-width: 200px; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec-h { display: flex; align-items: center; gap: 8px; min-height: 18px; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.sec-h .grow { flex: 1; }
.swatches { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; padding: 3px; }
.lab-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.lab-name { min-width: 0; padding: 0; border: 0; background: none; text-align: left; font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lab-name.unnamed { color: var(--muted); font-weight: 400; }
.lab-input { height: 30px; padding: 0 8px; min-width: 0; }
.hint { font-size: 12.5px; color: var(--muted); }
.dlg.arch { min-width: min(480px, calc(100vw - 48px)); }
.arch-list { display: flex; flex-direction: column; max-height: 50vh; overflow-y: auto; margin: 6px 0; }
.arch-row { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); }
.arch-t { flex: 1; min-width: 0; }
.arch-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arch-sub { font-size: 12px; color: var(--muted); }
.chk-row { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; margin-top: 2px; font-weight: 500; cursor: pointer; }
.chk-row input { width: 16px; height: 16px; accent-color: var(--accent); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12.5px; text-transform: none; letter-spacing: 0; }
@media (min-width: 640px) { .swatches { grid-template-columns: repeat(3, minmax(0, 1fr)); } .fig .swatches { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.swatch { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: var(--c); color: #fff; }
.swatch .ico { width: 14px; height: 14px; stroke-width: 2; opacity: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--c); }
.swatch[aria-pressed="true"] .ico { opacity: 1; }
.date-row { display: flex; align-items: center; gap: 8px; }
.date-row input { height: 32px; width: 168px; font-family: var(--mono); font-size: 13px; }
.cm textarea.field { min-height: 76px; overflow: hidden; }
.bar-track { height: 4px; border-radius: 2px; background: var(--panel); overflow: hidden; }
.bar-fill { height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }
.items { display: flex; flex-direction: column; gap: 2px; }
.item { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 2px 0 4px; border-radius: 7px; }
.item:hover { background: var(--panel); }
.item input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); flex: none; }
.item .txt { flex: 1; min-width: 0; height: 28px; padding: 0 6px; border: 1px solid transparent; border-radius: 6px; background: transparent; }
.item .txt:focus { background: var(--surface); border-color: var(--accent); outline: none; }
.item.done .txt { color: var(--muted); text-decoration: line-through; }
.item .icon-btn { width: 26px; height: 26px; opacity: 0; }
.item:hover .icon-btn, .item .icon-btn:focus-visible { opacity: 1; }
.cm-foot { display: flex; align-items: center; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }

/* Help */
.modal.help { max-width: 880px; }
.hp { display: grid; grid-template-columns: 210px 1fr; grid-template-rows: auto 1fr; height: min(80vh, 700px); }
.hp-head { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 14px 22px; border-bottom: 1px solid var(--line); }
.hp-head h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.02em; }
.hp-nav { display: flex; flex-direction: column; gap: 2px; padding: 12px; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); border-bottom-left-radius: 16px; }
.hp-link { display: block; width: 100%; padding: 8px 12px; border: 0; border-radius: 8px; background: transparent; text-align: left; font-weight: 500; color: var(--muted); }
.hp-link:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); color: var(--ink); }
.hp-link[aria-current] { background: var(--surface); color: var(--accent); font-weight: 600; box-shadow: var(--card-shadow); }
.hp-nav, .hp-body { min-height: 0; }

function normalize(d) {
  if (!d || !Array.isArray(d.boards) || !d.boards.length) throw new Error('No boards found.');
  const str = (v, f = '') => (typeof v === 'string' ? v : f);
  const seen = new Set();
  const uniq = v => { let id = typeof v === 'string' && v && !seen.has(v) ? v : uid(); while (seen.has(id)) id = uid(); seen.add(id); return id; };
  const card = c => ({
    id: uniq(c.id),
    title: str(c.title, 'Untitled') || 'Untitled',
    desc: str(c.desc),
    labels: (Array.isArray(c.labels) ? c.labels : []).filter((x, i, a) => /^l[1-6]$/.test(x) && a.indexOf(x) === i),
    due: /^\d{4}-\d\d-\d\d$/.test(c.due) ? c.due : '',
    done: c.done === true,
    checks: (Array.isArray(c.checks) ? c.checks : []).filter(k => k && typeof k === 'object').map(k => ({ id: uniq(k.id), text: str(k.text), done: !!k.done })),
    created: +c.created || Date.now(),
  });
  const boards = d.boards.filter(b => b && typeof b === 'object').map(b => {
    const lists = (Array.isArray(b.lists) ? b.lists : []).filter(l => l && typeof l === 'object').map(l => ({
      id: uniq(l.id),
      title: str(l.title, 'Untitled') || 'Untitled',
      cards: (Array.isArray(l.cards) ? l.cards : []).filter(c => c && typeof c === 'object').map(card),
    }));
    const names = {};
    if (b.names && typeof b.names === 'object') for (const [id] of LABELS) { const n = str(b.names[id]).trim().slice(0, 24); if (n) names[id] = n; }
    const archive = (Array.isArray(b.archive) ? b.archive : []).filter(a => a && typeof a === 'object' && a.card && typeof a.card === 'object').map(a => ({
      card: card(a.card), listId: str(a.listId), listTitle: str(a.listTitle, 'List') || 'List', at: +a.at || 0,
    }));
    return { id: uniq(b.id), name: str(b.name, 'Untitled') || 'Untitled', lists, names, archive, archived: b.archived === true };
  });
  if (!boards.length) throw new Error('No boards found.');
  if (boards.every(b => b.archived)) boards[0].archived = false;     // there is always one board to look at
  let active = boards.find(b => b.id === d.active && !b.archived) || boards.find(b => !b.archived);
  return { v: 3, active: active.id, updated: +d.updated || 0, boards };
}

    const snap = await Promise.race([ref.get(), timeout.then(() => { throw new Error('timeout'); })]);

const modalStack = [];
function openModal(node, { label, cls = '', onClose } = {}) {

  const overlay = h('div', { class: 'overlay' });
  const box = h('div', { class: 'modal ' + cls, role: 'dialog', 'aria-modal': 'true', 'aria-label': label }, node);
  overlay.append(box);
  const api = {
    box,
    close() {
      if (!overlay.isConnected) return;
      overlay.remove();
      const at = modalStack.indexOf(api); if (at > -1) modalStack.splice(at, 1);
      onClose && onClose();
      if (prev && prev.isConnected && prev !== document.body) prev.focus();
    },
  };
  const born = performance.now();
  // the second click of a double-click lands on the backdrop; it must not close what the first click opened
  overlay.addEventListener('pointerdown', e => { if (e.target === overlay && performance.now() - born > 450) api.close(); });
  document.body.append(overlay);
  modalStack.push(api);

// Escape and Tab are handled for the top dialog wherever focus happens to be, so the keyboard is never stranded.
document.addEventListener('keydown', e => {
  const top = modalStack[modalStack.length - 1];
  if (!top || openedMenu) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); top.close(); return; }
  if (e.key !== 'Tab') return;
  const f = [...top.box.querySelectorAll('button:not([disabled]), input:not([disabled]), textarea, select')].filter(x => x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1], a = document.activeElement;

  else if (e.shiftKey && a === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }

/* ---------- Excel export and import (no libraries) ---------- */
const XL = (() => {

  /* a zip with every file stored uncompressed: simple, and every spreadsheet program reads it */

    const parts = [], central = [];
    let offset = 0;

/* hands a generated file to the person: the downloads capability when hosted by Claude, otherwise a normal browser download */
async function saveFile(name, bytes) {
  const c = window.claude;
  if (c && typeof c.use === 'function') {
    try {
      const d = await c.use('downloads');
      if (d) { await d.save({ filename: name, data: bytes }); return true; }
    } catch (e) { if (e && e.code === 'declined') return false; }
  }
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  const a = h('a', { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}
const safeName = s => (String(s).replace(/[\\/:*?"<>|\u0000-\u001F]/g, '').trim().slice(0, 60) || 'Plank Board');
async function exportExcel() {
  try {
    const bytes = XL.build(S);
    const stamp = isoDate(new Date());
    const ok = await saveFile(`Plank Board ${stamp}.xlsx`, bytes);
    if (ok) toast('Excel file ready');
  } catch (e) { toast('Could not create the Excel file'); }
}
function importExcel() {
  const input = h('input', { type: 'file', accept: '.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', hidden: true });
  input.addEventListener('change', async () => {
    const f = input.files && input.files[0];
    input.remove();
    if (!f) return;
    try {
      if (f.size > 20e6) throw new Error('This file is larger than 20 MB.');
      const { boards, cards } = await XL.parse(await f.arrayBuffer());
      checkpoint();
      const names = new Set(S.boards.map(b => b.name));
      for (const b of boards) {
        let name = b.name, n = 2;
        while (names.has(name)) name = `${b.name.slice(0, 70)} (${n++})`;
        b.name = name; names.add(name); S.boards.push(b);
      }
      switchBoard(boards.find(b => !b.archived).id);
      toast(`Imported ${boards.length} board${boards.length === 1 ? '' : 's'} and ${cards} card${cards === 1 ? '' : 's'}`, true);
    } catch (e) {
      toast(e && e.message ? e.message : 'Could not read this file');
    }
  });
  document.body.appendChild(input);
  input.click();
}

function rich(text) {
  return text.split(/(\*\*[^*]+\*\*|\{[^}]+\})/).filter(Boolean).map(part => {
    if (part.startsWith('**')) return h('strong', { text: part.slice(2, -2) });
    if (part.startsWith('{')) return h('kbd', { text: part.slice(1, -1) });
    return part;
  });
}

function fit(root) {
  root.querySelectorAll('.fig').forEach(f => {
    const inner = f.firstChild;
    f.classList.remove('compact'); inner.style.zoom = '1';
    const avail = f.clientWidth - 24;
    if (avail > 0 && inner.scrollWidth > avail) f.classList.add('compact');   // stack side-by-side parts and drop optional extras

    const w = inner.scrollWidth;
    inner.style.zoom = String(avail > 0 && w > avail ? Math.max(.55, avail / w) : 1);
  });

(() => {
/* Plank Board team sync: pure functions shared by the server and the app.
   A board document is { name, names, archived, lists: [{id, title, cards: [card]}], archive: [{card, listId, listTitle, at}] }.
   Everything people do is expressed as small operations; the server applies them in one order and everyone converges. */

const LABEL_IDS = ['l1', 'l2', 'l3', 'l4', 'l5', 'l6'];
const LIMITS = { title: 500, desc: 20000, listTitle: 200, boardName: 200, labelName: 24, check: 500, checks: 300, lists: 200, cards: 5000, archive: 5000, opsPerBatch: 400 };

const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
const str = (v, f = '') => (typeof v === 'string' ? v : f);
const goodId = v => typeof v === 'string' && /^[A-Za-z0-9_-]{1,40}$/.test(v);
const clone = v => JSON.parse(JSON.stringify(v));
const canon = v => (Array.isArray(v) ? v.map(canon) : isObj(v) ? Object.fromEntries(Object.keys(v).sort().map(k => [k, canon(v[k])])) : v);
const same = (a, b) => JSON.stringify(canon(a)) === JSON.stringify(canon(b));

/* ---------- cleaning (the server never trusts a client) ---------- */
function cleanChecks(v) {
  return (Array.isArray(v) ? v : []).filter(isObj).slice(0, LIMITS.checks).map((k, i) => ({
    id: goodId(k.id) ? k.id : 'k' + i, text: str(k.text).slice(0, LIMITS.check), done: k.done === true,
  }));
}
const cleanFields = {
  title: v => (str(v).slice(0, LIMITS.title) || 'Untitled'),
  desc: v => str(v).slice(0, LIMITS.desc),
  labels: v => (Array.isArray(v) ? v : []).filter((x, i, a) => LABEL_IDS.includes(x) && a.indexOf(x) === i),
  due: v => (/^\d{4}-\d\d-\d\d$/.test(v) ? v : ''),
  done: v => v === true,
  checks: cleanChecks,
};
function cleanCard(c) {
  if (!isObj(c) || !goodId(c.id)) return null;
  const out = { id: c.id };
  for (const k of Object.keys(cleanFields)) out[k] = cleanFields[k](c[k]);
  out.created = Number.isFinite(+c.created) && +c.created > 0 ? +c.created : 0;
  return out;
}
function cleanNames(n) {
  const out = {};
  if (isObj(n)) for (const id of LABEL_IDS) { const t = str(n[id]).trim().slice(0, LIMITS.labelName); if (t) out[id] = t; }
  return out;
}
function cleanDoc(b) {
  const seen = new Set();
  const lists = [];
  for (const l of (isObj(b) && Array.isArray(b.lists) ? b.lists : []).slice(0, LIMITS.lists)) {
    if (!isObj(l) || !goodId(l.id) || seen.has(l.id)) continue;
    seen.add(l.id);
    const cards = [];
    for (const c of (Array.isArray(l.cards) ? l.cards : [])) { const cc = cleanCard(c); if (cc && !seen.has(cc.id)) { seen.add(cc.id); cards.push(cc); } }
    lists.push({ id: l.id, title: str(l.title).slice(0, LIMITS.listTitle) || 'Untitled', cards });
  }
  const archive = [];
  for (const a of (isObj(b) && Array.isArray(b.archive) ? b.archive : []).slice(0, LIMITS.archive)) {
    const cc = isObj(a) ? cleanCard(a.card) : null;
    if (cc && !seen.has(cc.id)) { seen.add(cc.id); archive.push({ card: cc, listId: str(a.listId).slice(0, 40), listTitle: str(a.listTitle, 'List').slice(0, LIMITS.listTitle) || 'List', at: +a.at || 0 }); }
  }
  return { name: (isObj(b) && str(b.name).trim().slice(0, LIMITS.boardName)) || 'Untitled', names: cleanNames(isObj(b) ? b.names : {}), archived: isObj(b) && b.archived === true, lists, archive };
}

/* ---------- finding things ---------- */
function findCard(doc, id) {
  for (const l of doc.lists) { const i = l.cards.findIndex(c => c.id === id); if (i > -1) return { list: l, i, card: l.cards[i] }; }
  return null;
}
const clamp = (i, n) => Math.max(0, Math.min(Number.isFinite(+i) ? Math.floor(+i) : n, n));
const cardCount = doc => doc.lists.reduce((n, l) => n + l.cards.length, 0);
const idTaken = (doc, id) => doc.lists.some(l => l.id === id) || !!findCard(doc, id) || doc.archive.some(a => a.card.id === id);

/* ---------- applying one operation (returns true when something changed) ---------- */
function applyOp(doc, op) {
  if (!isObj(op) || typeof op.o !== 'string') return false;
  switch (op.o) {
    case 'board.set': {
      let ch = false;
      if (typeof op.name === 'string' && op.name.trim()) { const n = op.name.trim().slice(0, LIMITS.boardName); if (n !== doc.name) { doc.name = n; ch = true; } }
      if (isObj(op.names)) { const n = cleanNames(op.names); if (!same(n, doc.names)) { doc.names = n; ch = true; } }
      if (typeof op.archived === 'boolean' && op.archived !== doc.archived) { doc.archived = op.archived; ch = true; }
      return ch;
    }
    case 'list.add': {
      const l = op.list; if (!isObj(l) || !goodId(l.id) || idTaken(doc, l.id) || doc.lists.length >= LIMITS.lists) return false;
      doc.lists.splice(clamp(op.index, doc.lists.length), 0, { id: l.id, title: str(l.title).slice(0, LIMITS.listTitle) || 'Untitled', cards: [] });
      return true;
    }
    case 'list.set': {
      const l = doc.lists.find(x => x.id === op.id); if (!l) return false;
      const t = str(op.title).slice(0, LIMITS.listTitle) || 'Untitled'; if (t === l.title) return false; l.title = t; return true;
    }
    case 'list.move': {
      const i = doc.lists.findIndex(x => x.id === op.id); if (i < 0) return false;
      const [l] = doc.lists.splice(i, 1); const j = clamp(op.index, doc.lists.length); doc.lists.splice(j, 0, l); return i !== j;
    }
    case 'list.del': {
      const i = doc.lists.findIndex(x => x.id === op.id); if (i < 0) return false; doc.lists.splice(i, 1); return true;
    }
    case 'card.add': {
      const c = cleanCard(op.card); if (!c || idTaken(doc, c.id) || cardCount(doc) >= LIMITS.cards) return false;
      const l = doc.lists.find(x => x.id === op.listId) || doc.lists[0]; if (!l) return false;   // a deleted list never swallows a card
      l.cards.splice(clamp(op.index, l.cards.length), 0, c); return true;
    }
    case 'card.set': {
      const f = findCard(doc, op.id); if (!f || !isObj(op.f)) return false;
      let ch = false;
      for (const k of Object.keys(cleanFields)) if (k in op.f) { const v = cleanFields[k](op.f[k]); if (!same(v, f.card[k])) { f.card[k] = v; ch = true; } }
      return ch;
    }
    case 'card.move': {
      const f = findCard(doc, op.id); if (!f) return false;
      const to = doc.lists.find(x => x.id === op.listId) || doc.lists[0]; if (!to) return false;
      f.list.cards.splice(f.i, 1);
      const j = clamp(op.index, to.cards.length); to.cards.splice(j, 0, f.card);
      return !(to === f.list && j === f.i);
    }
    case 'card.del': {
      const f = findCard(doc, op.id); if (!f) return false; f.list.cards.splice(f.i, 1); return true;
    }
    case 'arch.add': {
      const e = op.entry; const c = isObj(e) ? cleanCard(e.card) : null;
      if (!c || doc.archive.some(a => a.card.id === c.id) || findCard(doc, c.id) || doc.archive.length >= LIMITS.archive) return false;
      doc.archive.push({ card: c, listId: str(e.listId).slice(0, 40), listTitle: str(e.listTitle, 'List').slice(0, LIMITS.listTitle) || 'List', at: +e.at || 0 }); return true;
    }
    case 'arch.del': {
      const i = doc.archive.findIndex(a => a.card.id === op.id); if (i < 0) return false; doc.archive.splice(i, 1); return true;
    }

  }
}
function applyOps(doc, ops) { let ch = false; for (const op of ops) if (applyOp(doc, op)) ch = true; return ch; }

/* ---------- working out what changed: ops that turn doc a into doc b ---------- */
function diff(a, b) {
  const ops = [];
  const bs = {};
  if (a.name !== b.name) bs.name = b.name;
  if (!same(a.names, b.names)) bs.names = clone(b.names);
  if (a.archived !== b.archived) bs.archived = b.archived;
  if (Object.keys(bs).length) ops.push({ o: 'board.set', ...bs });

  // simulate the lists and card order so every move lands exactly where it should
  const sim = a.lists.map(l => ({ id: l.id, cards: l.cards.map(c => c.id) }));
  const targetListIds = new Set(b.lists.map(l => l.id));
  for (let i = sim.length - 1; i >= 0; i--) if (!targetListIds.has(sim[i].id)) { ops.push({ o: 'list.del', id: sim[i].id }); sim.splice(i, 1); }
  b.lists.forEach((l, i) => {
    if (!sim.some(s => s.id === l.id)) { ops.push({ o: 'list.add', index: i, list: { id: l.id, title: l.title } }); sim.splice(Math.min(i, sim.length), 0, { id: l.id, cards: [] }); }
  });
  b.lists.forEach((l, i) => {
    if (sim[i].id !== l.id) { const j = sim.findIndex(s => s.id === l.id); const [s] = sim.splice(j, 1); sim.splice(i, 0, s); ops.push({ o: 'list.move', id: l.id, index: i }); }
  });
  const aList = new Map(a.lists.map(l => [l.id, l]));
  b.lists.forEach(l => { const al = aList.get(l.id); if (al && al.title !== l.title) ops.push({ o: 'list.set', id: l.id, title: l.title }); });

  // restoring from the archive: the archive entry must go before the card comes back
  // the archive is an ordered list: keep the common start, then remove and re-add whatever differs
  let keep = 0;
  while (keep < a.archive.length && keep < b.archive.length && same(a.archive[keep], b.archive[keep])) keep++;
  for (let i = keep; i < a.archive.length; i++) ops.push({ o: 'arch.del', id: a.archive[i].card.id });

  const bCards = new Map(); b.lists.forEach(l => l.cards.forEach(c => bCards.set(c.id, c)));
  const aCards = new Map(); a.lists.forEach(l => l.cards.forEach(c => aCards.set(c.id, c)));
  for (const id of aCards.keys()) if (!bCards.has(id)) {
    const holder = sim.find(s => s.cards.includes(id));
    if (holder) { ops.push({ o: 'card.del', id }); holder.cards.splice(holder.cards.indexOf(id), 1); }
  }
  b.lists.forEach((l, li) => {
    const target = sim[li];
    l.cards.forEach((c, i) => {
      if (target.cards[i] === c.id) return;
      const from = sim.find(s => s.cards.includes(c.id));
      if (from) { from.cards.splice(from.cards.indexOf(c.id), 1); target.cards.splice(Math.min(i, target.cards.length), 0, c.id); ops.push({ o: 'card.move', id: c.id, listId: l.id, index: i }); }
      else { target.cards.splice(Math.min(i, target.cards.length), 0, c.id); ops.push({ o: 'card.add', listId: l.id, index: i, card: clone(c) }); }
    });
  });
  for (const [id, c] of bCards) {
    const old = aCards.get(id); if (!old) continue;
    const f = {};
    for (const k of Object.keys(cleanFields)) if (!same(old[k], c[k])) f[k] = clone(c[k]);
    if (Object.keys(f).length) ops.push({ o: 'card.set', id, f });
  }
  for (let i = keep; i < b.archive.length; i++) ops.push({ o: 'arch.add', entry: clone(b.archive[i]) });
  return ops;
}

/* ---------- copy a document into the live one without replacing the objects the screen holds ---------- */
function syncInto(live, model) {
  live.name = model.name; live.archived = model.archived;
  for (const k of Object.keys(live.names)) delete live.names[k];
  Object.assign(live.names, model.names);
  const cardById = new Map();
  live.lists.forEach(l => l.cards.forEach(c => cardById.set(c.id, c)));
  live.archive.forEach(a => cardById.set(a.card.id, a.card));
  const fill = mc => {
    let c = cardById.get(mc.id);
    if (!c) { c = {}; cardById.set(mc.id, c); }
    c.id = mc.id; c.title = mc.title; c.desc = mc.desc; c.labels = mc.labels.slice(); c.due = mc.due; c.done = mc.done; c.created = mc.created;
    c.checks = mc.checks.map(k => ({ id: k.id, text: k.text, done: k.done }));
    return c;
  };
  const listById = new Map(live.lists.map(l => [l.id, l]));
  const lists = model.lists.map(ml => {
    const l = listById.get(ml.id) || { id: ml.id, title: '', cards: [] };
    l.title = ml.title;
    l.cards.splice(0, l.cards.length, ...ml.cards.map(fill));
    return l;
  });
  live.lists.splice(0, live.lists.length, ...lists);
  const arch = model.archive.map(ma => ({ card: fill(ma.card), listId: ma.listId, listTitle: ma.listTitle, at: ma.at }));
  live.archive.splice(0, live.archive.length, ...arch);
}

/* ---------- one board's sync state on a client ----------
   confirmed: what the server has told us.  pending: our batches the server has not echoed yet.
   model: confirmed plus pending, i.e. what the screen should show.  The live document is the screen's working copy. */
class BoardSync {
  constructor(doc) { this.confirmed = clone(doc); this.pending = []; this.model = clone(doc); this.n = 0; }
  // Turn the person's unsent edits (live differs from model) into a batch to send.
  collect(live, newId) {
    const ops = diff(this.model, live);
    if (!ops.length) return null;
    const inverse = diff(live, this.model);
    const batch = { opid: newId ? newId() : 'b' + (++this.n), ops };
    this.pending.push(batch);
    applyOps(this.model, ops);
    return { batch, inverse };
  }
  // A batch arrived from the server (ours coming back, or someone else's).
  receive(msg, live, mine, newId) {
    const extra = this.collect(live, newId);
    applyOps(this.confirmed, msg.ops);
    if (mine) { const i = this.pending.findIndex(b => b.opid === msg.opid); if (i > -1) this.pending.splice(i, 1); }
    const next = clone(this.confirmed);
    for (const b of this.pending) applyOps(next, b.ops);
    const changed = !same(next, this.model);
    this.model = next;
    if (changed) syncInto(live, next);
    return { extra, changed };
  }
  // The server sent a whole new copy (first load, or after a problem). Any unsent edits are replayed on top.
  reset(doc, live) {
    const extra = live ? this.collect(live) : null;
    this.confirmed = clone(doc);
    const next = clone(doc);
    for (const b of this.pending) applyOps(next, b.ops);
    this.model = next;
    if (live) syncInto(live, next);
    return extra;
  }
}

/* ---------- team mode: boards live on the team server and everyone sees changes as they happen ---------- */
T.on = true;
const CID = uid() + uid();
const tb = new Map();            // board id -> { id, role, ws, up, tries, timer, sync, live, presence, removed }
const order = new Map();         // board id -> position in the list the server gave us
const creating = new Set();
let me = '', opn = 0, dirty = false, groups = [], lastCheck = 0;
const newOp = () => CID + '-' + (++opn);
const NAME_KEY = 'plank.team.name';
const tidy = v => String(v || '').replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 30);
let myName = ''; try { myName = tidy(localStorage.getItem(NAME_KEY)); } catch (e) { /* ignore */ }
const headers = () => ({ 'content-type': 'application/json', 'x-plank': '1', 'x-plank-name': encodeURIComponent(myName || 'Someone') });
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: headers(), body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin' });
  let data = null; try { data = await r.json(); } catch (e) { /* no body */ }
  if (r.status === 401) {                       // the password cookie ran out or the password changed: go back to the password page
    let again = false; try { again = Date.now() - +sessionStorage.getItem('plank.reload') < 15000; sessionStorage.setItem('plank.reload', String(Date.now())); } catch (e) { /* ignore */ }
    if (!again) { location.reload(); return new Promise(() => {}); }
  }
  if (!r.ok) { const err = new Error((data && data.error) || ('Something went wrong (' + r.status + ')')); err.status = r.status; throw err; }
  return data;
}

/* ----- one live connection per board ----- */
function openBoard(meta, live) {
  const rec = { id: meta.id, role: 'owner', ws: null, up: false, tries: 0, timer: null, sync: null, live: live || null, presence: [], removed: false, deleting: false, onActivity: null, resolve: null };
  rec.first = new Promise(r => { rec.resolve = r; });
  tb.set(meta.id, rec); dial(rec); return rec;
}
function dial(rec) {
  if (rec.removed) return;
  clearTimeout(rec.timer); rec.timer = null;
  const ws = new WebSocket(location.origin.replace(/^http/, 'ws') + '/ws/' + rec.id + '?cid=' + CID + '&name=' + encodeURIComponent(myName || 'Someone'));
  rec.ws = ws;
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (x) { return; } onMsg(rec, m); };
  ws.onclose = ev => {
    if (rec.ws !== ws || rec.removed) return;
    rec.up = false;
    if (ev.code === 4004) return lose(rec, 'deleted');
    redial(rec); setWarn();
  };
  ws.onerror = () => { /* onclose follows */ };
}
function redial(rec) {
  if (rec.removed || rec.timer) return;
  rec.tries++;
  rec.timer = setTimeout(async () => {
    rec.timer = null;
    if (rec.tries >= 2) { try { const l = await api('GET', '/api/boards'); if (!l.boards.some(b => b.id === rec.id) && rec.live && !creating.has(rec.id)) return lose(rec, 'removed'); } catch (e) { /* offline */ } }
    dial(rec);
  }, Math.min(15000, 700 * 2 ** Math.min(rec.tries, 5)));
}
function sendBatch(rec, batch) {
  if (rec.ws && rec.ws.readyState === 1) { try { rec.ws.send(JSON.stringify({ t: 'ops', opid: batch.opid, ops: batch.ops })); } catch (e) { /* resent after reconnect */ } }
}
function onMsg(rec, m) {
  if (m.t === 'hello') {
    rec.tries = 0; rec.up = true; if (m.you) me = m.you;
    if (!rec.sync) {
      rec.sync = new BoardSync(m.doc);
      if (rec.live) syncInto(rec.live, m.doc); else rec.live = Object.assign(clone(m.doc), { id: rec.id, role: rec.role });
      place(rec); rec.resolve();
    } else {
      const extra = rec.sync.reset(m.doc, rec.live);
      if (extra) record(rec, extra);
    }
    rec.live.role = rec.role;
    for (const b of rec.sync.pending) sendBatch(rec, b);       // anything not yet confirmed is sent again; applying twice changes nothing
    rec.presence = m.presence || [];
    setWarn(); if (rec.id === S.active) { renderHeader(); renderBoard(); }
  } else if (m.t === 'ops' && rec.sync) {
    const r = rec.sync.receive(m, rec.live, m.cid === CID, newOp);
    if (r.extra) { record(rec, r.extra); sendBatch(rec, r.extra.batch); }
    if (r.changed) { if (rec.id === S.active) { dirty = true; tick(); } }
  } else if (m.t === 'you') {
    if (m.name) me = m.name;
  } else if (m.t === 'presence') {
    rec.presence = m.users || []; if (rec.id === S.active) drawPresence();
  } else if (m.t === 'activity') {
    if (rec.onActivity) rec.onActivity(m.items || []);
  } else if (m.t === 'gone') {
    if (!rec.removed) lose(rec, 'deleted');
  }
}
function place(rec) {
  if (S.boards.includes(rec.live)) return;
  const idx = order.has(rec.id) ? order.get(rec.id) : 1e9;
  let at = S.boards.findIndex(b => (order.has(b.id) ? order.get(b.id) : 1e9) > idx);
  if (at < 0) at = S.boards.length;
  S.boards.splice(at, 0, rec.live);
}
function lose(rec, why) {
  if (rec.removed) return;
  rec.removed = true; clearTimeout(rec.timer); try { rec.ws && rec.ws.close(); } catch (e) { /* closed */ }
  tb.delete(rec.id);
  const name = rec.live ? rec.live.name : 'A board';
  const i = rec.live ? S.boards.indexOf(rec.live) : -1; if (i > -1) S.boards.splice(i, 1);
  modalStack.slice().forEach(m => m.close());
  if (!S.boards.length) { const b = starter().boards[0]; S.boards.push(b); S.active = b.id; }
  if (S.active === rec.id || !S.boards.some(b => b.id === S.active)) { const nb = S.boards.find(b => !b.archived) || S.boards[0]; S.active = nb.id; ui.composer = null; ui.addList = false; }
  renderHeader(); renderBoard(); setWarn();
  toast(why === 'deleted' ? `“${name}” was deleted` : `“${name}” is no longer available`);
}

/* ----- turning what the person did on screen into operations ----- */
function record(rec, out) {                      // remember how to undo this batch
  const g = groups[groups.length - 1];
  if (g && out.inverse && out.inverse.length) g.inv.unshift({ id: rec.id, ops: out.inverse });
}
function collectAll() {
  for (const rec of tb.values()) {
    if (!rec.sync || !rec.live) continue;
    const out = rec.sync.collect(rec.live, newOp);
    if (out) { record(rec, out); sendBatch(rec, out.batch); }
  }
}
async function createBoard(b) {
  creating.add(b.id);
  try {
    const res = await api('POST', '/api/boards', { id: b.id, board: b });
    if (res.id !== b.id) { if (S.active === b.id) S.active = res.id; b.id = res.id; }
    b.role = 'owner'; order.set(b.id, order.size);
    openBoard({ id: b.id, role: 'owner' }, b);
  } catch (e) { setTimeout(() => creating.delete(b.id), 4000); return; }
  creating.delete(b.id);
}
async function deleteBoard(rec) {
  if (rec.deleting) return; rec.deleting = true;
  try { await api('DELETE', '/api/boards/' + rec.id); rec.removed = true; clearTimeout(rec.timer); try { rec.ws && rec.ws.close(); } catch (e) { /* closed */ } tb.delete(rec.id); }
  catch (e) { rec.deleting = false; toast('Could not delete the board. Try again.'); place(rec); renderHeader(); renderBoard(); }
}
T.flush = () => {
  for (const b of S.boards) if (!tb.has(b.id) && !creating.has(b.id)) createBoard(b);                         // a board made or imported on this screen
  for (const rec of [...tb.values()]) if (rec.live && rec.sync && !rec.removed && !S.boards.includes(rec.live)) deleteBoard(rec);   // deleted forever on this screen
  collectAll();
  try { localStorage.setItem('plank.team.active', S.active); } catch (e) { /* ignore */ }
  setWarn();
};
T.checkpoint = () => { collectAll(); groups.push({ inv: [] }); if (groups.length > 60) groups.shift(); };
T.undo = () => {
  collectAll();
  let g = groups.pop();
  while (g && !g.inv.length) g = groups.pop();
  if (!g) return false;
  document.querySelectorAll('.overlay').forEach(o => o.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })));
  for (const e of g.inv) {
    const rec = tb.get(e.id); if (!rec || !rec.live) continue;
    applyOps(rec.live, e.ops);
    if (S.boards.includes(rec.live) && !rec.live.archived) S.active = rec.id;
  }
  ui.composer = null; ui.addList = false;
  touch(); renderHeader(); renderBoard();
  return true;
};

/* ----- showing other people's changes without disturbing you ----- */
function inBoardField() { const a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !!a.closest('#board'); }
function inSheetField() { const a = document.activeElement; return !!a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && !!a.closest('.overlay'); }
function tick() {
  if (!dirty || drag || press || inBoardField()) return;
  dirty = false;
  const a = document.activeElement, c = a && a.closest && a.closest('.card');
  if (c && c.dataset.id) ui.focusCardId = c.dataset.id;
  renderHeader(); renderBoard();
  if (ui.cardPaint && !inSheetField()) ui.cardPaint.paint();
}
setInterval(tick, 250);
const hue = s => { let x = 0; for (const ch of s) x = (x * 31 + ch.charCodeAt(0)) >>> 0; return x % 360; };
const initials = e => { const p = e.split(' ').filter(Boolean); return ((p[0] || '?')[0] + (p[1] ? p[1][0] : (p[0] || '')[1] || '')).toUpperCase(); };
function drawPresence() {
  const el = $('#presence'); if (!el) return;
  const rec = tb.get(S.active); const others = ((rec && rec.presence) || []).filter(x => x !== me);
  el.classList.toggle('show', others.length > 0);
  const chips = others.slice(0, 4).map(x => h('span', { class: 'pp', style: `background:hsl(${hue(x)} 55% 36%)`, title: x + ' is here too', 'aria-label': x + ' is on this board', text: initials(x) }));
  if (others.length > 4) chips.push(h('span', { class: 'pp more', title: others.slice(4).join(', '), text: '+' + (others.length - 4) }));
  el.replaceChildren(...chips);
}
const baseHeader = renderHeader;
renderHeader = () => { baseHeader(); drawPresence(); };

T.warn = w => {
  const down = [...tb.values()].some(r => r.sync && !r.up && !r.removed);
  const waiting = [...tb.values()].reduce((n, r) => n + (r.sync ? r.sync.pending.length : 0), 0);
  w.classList.toggle('show', down);
  w.textContent = 'Offline';
  w.title = down ? (waiting ? `Reconnecting. Your ${waiting} latest change${waiting === 1 ? '' : 's'} will be sent when you are back online.` : 'Reconnecting. If this lasts, reload the page.') : '';
};

/* ----- who is here, and the activity trail ----- */
const ago = at => { const s = (Date.now() - at) / 1000; return s < 60 ? 'just now' : s < 3600 ? Math.floor(s / 60) + ' min ago' : s < 86400 ? Math.floor(s / 3600) + ' h ago' : new Date(at).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); };
function activityDialog() {
  const rec = tb.get(S.active); if (!rec) return;
  const root = h('div', { class: 'dlg' });
  const m = openModal(root, { label: 'Activity', onClose: () => { rec.onActivity = null; } });
  function paint(items) {
    root.replaceChildren(...[
      h('h2', { text: 'Activity' }),
      h('p', { class: 'hint', text: `Recent changes on “${rec.live.name}”, newest first.` }),
      items === null ? h('div', { class: 'empty-hint', text: 'Loading…' })
        : items.length ? h('div', { class: 'arch-list' }, items.map(i => h('div', { class: 'act-row' }, `${i.who === me ? 'You' : i.who} ${i.text}`, h('small', { text: ago(i.at) }))))
          : h('div', { class: 'empty-hint', text: 'Nothing yet. Changes will appear here.' }),
      h('div', { class: 'dlg-actions' }, h('button', { type: 'button', class: 'btn primary', id: 'act-close', text: 'Close', onclick: () => m.close() }))].filter(Boolean));
  }
  rec.onActivity = paint; paint(null);
  try { rec.ws.send(JSON.stringify({ t: 'activity' })); } catch (e) { paint([]); }
}
const when = at => new Date(at).toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
function backupsDialog() {
  const rec = tb.get(S.active); if (!rec) return;
  const root = h('div', { class: 'dlg' });
  const m = openModal(root, { label: 'Backups' });
  let items = null, err = '', ask = null, busy = false;
  async function load() {
    try { items = (await api('GET', `/api/boards/${rec.id}/snapshots`)).snapshots; err = ''; }
    catch (e) { items = items || []; err = 'Could not load the backups.'; }
    paint();
  }
  async function restore(at) {
    busy = true; paint();
    try { await api('POST', `/api/boards/${rec.id}/snapshots/${at}`); toast('Board restored. The version it replaced is kept as a backup.'); m.close(); return; }
    catch (e) { err = 'Could not restore that backup.'; }
    busy = false; ask = null; await load();
  }
  function paint() {
    const rows = items === null ? [h('div', { class: 'empty-hint', text: 'Loading…' })]
      : items.length ? items.map(b => h('div', { class: 'tm-row' + (ask === b.at ? ' asking' : '') },
        ask === b.at
          ? [h('div', { class: 'tm-who' }, 'Replace the board with this version?', h('small', { text: `${when(b.at)}, ${b.cards} card${b.cards === 1 ? '' : 's'}` })),
            h('button', { type: 'button', class: 'btn', text: 'Cancel', disabled: busy ? true : null, onclick: () => { ask = null; paint(); } }),
            h('button', { type: 'button', class: 'btn primary', id: 'bk-confirm', text: busy ? 'Restoring…' : 'Restore', disabled: busy ? true : null, onclick: () => restore(b.at) })]
          : [h('div', { class: 'tm-who' }, when(b.at), h('small', { text: `${b.lists} list${b.lists === 1 ? '' : 's'}, ${b.cards} card${b.cards === 1 ? '' : 's'} · ${ago(b.at)}` })),
            h('button', { type: 'button', class: 'btn', text: 'Restore', 'aria-label': 'Restore the backup from ' + when(b.at), onclick: () => { ask = b.at; paint(); } })]))
        : [h('div', { class: 'empty-hint', text: 'No backups yet. One is saved every hour while the board is in use.' })];
    root.replaceChildren(...[
      h('h2', { text: 'Backups' }),
      h('p', { class: 'hint', text: `A copy of “${rec.live.name}” is saved every hour, and the last 48 are kept. Restoring replaces the board for everyone. The version you replace is saved first, so you can go back.` }),
      err ? h('p', { class: 'hint', text: err }) : null,
      h('div', { class: 'arch-list' }, rows),
      h('div', { class: 'dlg-actions' }, h('button', { type: 'button', class: 'btn primary', id: 'bk-close', text: 'Close', onclick: () => m.close() }))].filter(Boolean));
  }
  paint(); load();
}
const nameDialog = first => new Promise(done => {
  const root = h('div', { class: 'dlg' });
  let saved = false;
  const input = h('input', { type: 'text', class: 'field', id: 'nm-input', maxlength: '30', value: myName, autocomplete: 'nickname', 'aria-label': 'Your name' });
  const save = () => {
    const v = tidy(input.value); if (!v) { input.focus(); return; }
    saved = true; const changed = v !== myName; myName = v; me = v;
    try { localStorage.setItem(NAME_KEY, v); } catch (e) { /* ignore */ }
    m.close();
    if (changed && !first) { for (const r of tb.values()) { try { if (r.ws && r.ws.readyState === 1) r.ws.send(JSON.stringify({ t: 'name', name: v })); } catch (e) { /* the next connection uses the new name */ } } toast('Your name is now ' + v); }
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); save(); } });
  const m = openModal(root, { label: first ? 'Your name' : 'Change my name', onClose: () => { if (!saved && !myName) myName = 'Someone'; me = myName; done(); } });
  root.replaceChildren(
    h('h2', { text: first ? 'What should we call you?' : 'Change my name' }),
    h('p', { class: 'hint', text: 'Teammates see this name next to the round badge at the top and in the activity list. It is only a label, so use your first name.' }),
    input,
    h('div', { class: 'dlg-actions' }, h('button', { type: 'button', class: 'btn primary', id: 'nm-save', text: first ? 'Continue' : 'Save', onclick: save })));
  input.focus(); input.select();
});
async function signOut() { try { await api('POST', '/auth/logout'); } catch (e) { /* the page reload shows the password page either way */ } location.reload(); }
T.menuItems = () => [
  { sep: true },
  { label: 'Activity', run: activityDialog },
  { label: 'Backups…', run: backupsDialog },
  { label: 'Change my name…', run: () => nameDialog(false) },
  { label: 'Sign out', run: signOut },
  { label: 'You are ' + me, disabled: true },
];

/* ----- the help text, adapted for a shared team board ----- */
T.help = base => {
  const teamSec = { id: 'team', title: 'Working with your team', lead: 'Everyone who knows the address and the team password sees the same boards, and every change appears for everyone the moment it happens.', blocks: [
    ['h', 'Getting in'],
    ['steps', [
      ['Open the address', 'Use the web address your team shares. Bookmark it.'],
      ['Type the team password', 'You only need it once on each device. After that this page remembers you for about a month.'],
      ['Tell us your name', 'The first time, type your first name. Teammates see it next to your round badge and in the activity list. Change it any time from the **⋯** menu with **Change my name**.'],
    ]],
    ['h', 'Working at the same time'],
    ['list', [
      '**Live changes.** When a teammate adds, edits or moves a card, you see it appear without reloading.',
      '**Who is here.** Round badges at the top show who else has the board open. Point at a badge to see the name.',
      '**Same card, same moment.** If two people change the same part of a card at the same time, the most recent change is kept. Changes to different parts, such as one person editing notes and another ticking complete, are both kept.',
      '**Activity.** Choose **Activity** from the **⋯** menu to see who did what and when.',
      '**New boards.** A board a teammate makes appears in your board list within about half a minute.',
    ]],
    ['h', 'Backups'],
    ['steps', [
      ['Open Backups', 'Click the **⋯** button, then choose **Backups**.'],
      ['Pick a version', 'A copy of the board is saved every hour, and the last 48 are kept. Each line shows the time and how many lists and cards it had. Click **Restore** next to the one you want.'],
      ['Confirm', 'Click **Restore** again to confirm, or **Cancel** to leave things as they are. The board changes for everyone straight away.'],
      ['Changed your mind?', 'The version you replaced is saved as a new backup first. Open **Backups** again and restore it.'],
    ]],
    ['h', 'If the connection drops'],
    ['list', [
      '**Offline** appears at the top when this page cannot reach the server. Keep working: your changes stay on the screen and are sent as soon as you are back.',
      'If it lasts a long time, reload the page. You may be asked for the team password again.',
    ]],
    ['h', 'Signing out'],
    ['list', ['Open the **⋯** menu and choose **Sign out**. Do this on a shared computer.']],
    ['tip', 'Archive is the safe way to tidy up. Archived cards and boards can be restored by anyone. Deleting a board for good removes it for everyone, so check with the team first.'],
  ] };
  const out = base.map(sec => {
    if (sec.id === 'saving') return { ...sec, title: 'Saving', lead: 'You never need to save by hand. Your boards are kept on the team server.', blocks: [
      ['list', [
        '**Saved for everyone.** Every change is sent to the team server within a moment, and your teammates see it straight away.',
        '**Any device.** Open this page on another computer or phone, type the team password, and you see the same boards.',
        '**History.** The server keeps hourly backups of every board. Open **Backups** in the **⋯** menu to bring back an earlier version.',
      ]],
      ['h', 'What the small message means'],
      ['list', ['**Offline:** this page cannot reach the server right now. Your latest changes wait on the screen and are sent when the connection returns.']],
      ['tip', 'Export to Excel from the **⋯** menu whenever you want your own copy.'],
    ] };
    if (sec.id === 'undo') return { ...sec, blocks: [...sec.blocks, ['tip', 'On a shared board, Undo takes back only your own last change. Your teammates\' work is never undone.']] };
    if (sec.id === 'faq') return { ...sec, blocks: sec.blocks.map(b => b[0] === 'faq' ? ['faq', [...b[1].filter(([q]) => !/other device/i.test(q)), ['How do I add a teammate?', 'Send them the web address and the team password. They then see all the boards.'], ['It asks for the password again.', 'The password is remembered for about a month on each device, and it stops working if the team password is changed. Ask whoever set it up for the current one.'], ['Why does it say Offline?', 'This page lost its connection to the server. Keep working. Your changes are sent when the connection returns.']]] : b) };
    return sec;
  });
  const at = out.findIndex(x => x.id === 'boards');
  out.splice(at + 1, 0, teamSec);
  return out;
};

/* ----- coming back to the tab, new boards made by teammates ----- */
async function refreshBoards(force) {
  if (!force && Date.now() - lastCheck < 5000) return;
  lastCheck = Date.now();
  try {
    const list = await api('GET', '/api/boards');
    const ids = new Set(list.boards.map(b => b.id));
    for (const meta of list.boards) if (!tb.has(meta.id) && !creating.has(meta.id)) {
      order.set(meta.id, order.size);
      const rec = openBoard(meta);
      rec.first.then(() => { renderHeader(); toast(`“${rec.live.name}” was added by a teammate`); });
    }
    for (const rec of [...tb.values()]) if (!ids.has(rec.id) && rec.live && !rec.removed && !rec.deleting && !creating.has(rec.id)) lose(rec, 'removed');
  } catch (e) { /* offline: the connections report it */ }
}
T.wake = () => { for (const rec of tb.values()) if (!rec.up && !rec.removed && rec.sync) { rec.tries = 0; dial(rec); } refreshBoards(false); };
addEventListener('online', () => T.wake());
setInterval(() => { if (document.visibilityState === 'visible') refreshBoards(true); }, 30000);

/* ----- start ----- */
function fatal(text) {
  S = { v: 3, active: 'x', updated: 0, boards: [{ id: 'x', name: 'Plank Board', lists: [], names: {}, archive: [], archived: false }] };
  renderHeader(); renderBoard();
  document.body.append(h('div', { class: 'overlay' }, h('div', { class: 'modal', role: 'alertdialog', 'aria-label': 'Cannot connect' }, h('div', { class: 'dlg' },
    h('h2', { text: 'Cannot connect' }), h('p', { class: 'hint', text }),
    h('div', { class: 'dlg-actions' }, h('button', { type: 'button', class: 'btn primary', text: 'Try again', onclick: () => location.reload() }))))));
}
T.boot = async () => {
  S = { v: 3, active: 'x', updated: 0, boards: [{ id: 'x', name: 'Plank Board', lists: [], names: {}, archive: [], archived: false }] };
  if (!myName) { renderHeader(); renderBoard(); await nameDialog(true); }
  me = myName;
  let list;
  try { list = await api('GET', '/api/boards'); }
  catch (e) { S = { v: 3, active: 'x', updated: 0, boards: [] }; return fatal(e.status === 503 ? e.message : 'Plank Board could not reach the server. Check your connection and try again. If the password was changed, reloading will ask for it again.'); }
  S = { v: 3, active: '', updated: 0, boards: [] };
  let metas = list.boards;
  list.boards.forEach((b, i) => order.set(b.id, i));
  if (!metas.length) {                                         // first visit by anyone: start with a sample board
    const b = starter().boards[0];
    try { const res = await api('POST', '/api/boards', { id: b.id, board: b }); metas = [{ id: res.id, name: res.name, archived: false }]; order.set(res.id, 0); }
    catch (e) { return fatal('Plank Board could not create your first board. Reload to try again.'); }
  }
  const recs = metas.map(meta => openBoard(meta));
  await Promise.race([Promise.all(recs.map(r => r.first)), sleep(8000)]);
  if (!S.boards.length) return fatal('Plank Board could not open your boards. Reload to try again.');
  let saved = ''; try { saved = localStorage.getItem('plank.team.active') || ''; } catch (e) { /* ignore */ }
  const pick = S.boards.find(b => b.id === saved && !b.archived) || S.boards.find(b => !b.archived) || S.boards[0];
  S.active = pick.id;
  renderHeader(); renderBoard(); setWarn();
  recs.forEach(r => r.first.then(() => { renderHeader(); }));
};

})();

/* ---------- boot ---------- */
async function boot() {
  if (T.on) { await T.boot(); return; }
  if (desk) {
    let notice = '';
    try {
      const r = await desk.load();
      if (r && r.json) { S = normalize(JSON.parse(r.json)); notice = r.notice || ''; }
    } catch (e) { S = null; }
    startedEmpty = !S;
    S = S || starter();
    renderHeader(); renderBoard();
    if (notice) toast(notice);
    if (startedEmpty || notice) { desk.save(JSON.stringify(S)).catch(() => { /* the first change will try again */ }); }
    return;
  }
  S = loadLocal();
  startedEmpty = !S;
  S = S || starter();
  renderHeader();
  renderBoard();
  try { localStorage.getItem(KEY); } catch (e) { storageOK = false; setWarn(); }
  connect();
}
boot();
})();
</script>
